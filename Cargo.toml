[workspace]
resolver        = "3"
members         = [".", "crates/cfg", "crates/fulltest"]
default-members = [".", "crates/cfg"]

[workspace.package]
authors      = ["NLnet Labs <rust-team@nlnetlabs.nl>"]
repository   = "https://github.com/NLnetLabs/cascade-hsm-bridge/"
license      = "BSD-3-Clause"
version      = "0.1.0-beta2-dev"
edition      = "2024"
rust-version = "1.88"

[workspace.dependencies]
clap       = { version = "4.5", features = ["cargo", "derive"] }
daemonbase = { version = "0.1.5" }
tracing    = { version = "0.1", features = ["log"] }

[package]
name                   = "cascade-hsm-bridge"
description            = "A KMIP to PKCS#11 bridge."
keywords               = ["KMIP", "PKCS#11", "HSM", "Rust"]
categories             = ["cryptography"]
readme                 = "README.md"
exclude                = [".github", ".gitignore"]
authors.workspace      = true
repository.workspace   = true
license.workspace      = true
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true

[dependencies]
bcder = "0.7.5"
clap = { workspace = true }
cryptoki = "^0.12.0"
daemonbase = { workspace = true }
domain = { git = "https://github.com/NLnetLabs/domain", branch = "main", version = "0.12.3", features = ["unstable-crypto-backend", "openssl"] } # for utils::base16 and crypto::DigestBuilder
hex = "0.4"
kmip = { git = "https://github.com/NLnetLabs/kmip-protocol", package = "kmip-protocol", branch = "bump-dependencies", version = "0.5.1-dev", default-features = false, features = ["tls-with-tokio-rustls", "ring"] }
cascade-hsm-bridge-cfg = { path = "crates/cfg" }
listenfd = "1.0.2"
tracing = { workspace = true }
moka = { version = "0.12.10", features = ["sync"] }
r2d2 = "0.8.10"
rand = "0.9.2"
rcgen = { version = "0.14.3" }
rpki = { version = "0.18", features = ["crypto"] }
tokio = { version = "1.47.1", features = ["macros", "io-util", "net", "rt-multi-thread"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "logging", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
tokio-rustls = { version = "0.26.2", default-features = false, features = ["logging", "tls12"] }

# 'daemonbase' depends on 'syslog', which has a lax version specifier for 'time'.
# TODO: 'syslog' is unmaintained, we should stop using it in 'daemonbase'.
[dependencies.time]
version = "0.3.9"
default-features = false

[profile.release]
panic = "abort"

[package.metadata.deb]
assets = [
  ["target/release/cascade-hsm-bridge", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/cascade-hsm-bridge/", "644"],
  ["doc/manual/build/man/cascade-hsm-bridge.1", "usr/share/man/man1/cascade-hsm-bridge.1", "644"],
  ["doc/manual/build/man/cascade-hsm-bridge-config.toml.5", "usr/share/man/man5/cascade-hsm-bridge-config.toml.5", "644"],
  ["etc/config.toml.system-service", "etc/cascade-hsm-bridge/config.toml", "644"],
  ["pkg/common/service.preset", "usr/lib/systemd/service-preset/50-cascade-hsm-bridge.preset", "644"],
]
name = "cascade-hsm-bridge"
maintainer = "NLnet Labs <rust-team@nlnetlabs.nl>"
license-file = ["LICENSE", "0"]
extended-description = """\
A bridge for connecting OASIS KMIP compatible HSM clients to PKCS#11 compatible HSMs."""
depends = "$auto, adduser"

# Instruct APT to replace the kmip2pkcs11 package with the new cascade-hsm-bridge package.
# See: https://www.debian.org/doc/debian-policy/ch-relationships.html#replacing-whole-packages-forcing-their-removal
conflicts = "kmip2pkcs11"
replaces = "kmip2pkcs11"

section = "net"
priority = "optional"
maintainer-scripts = "pkg/debian"
changelog = "target/debian/changelog" # this will be generated by the pkg workflow
copyright = "Copyright (c) 2025, NLnet Labs. All rights reserved."
conf-files = ["/etc/cascade-hsm-bridge/config.toml"]
systemd-units = { unit-name = "cascade-hsm-bridge", unit-scripts = "pkg/common", enable = false, usr-merge = true } # usr-merge is needed for Bookworm/Noble and later

[package.metadata.deb.variants.debian-buster]
systemd-units = { unit-name = "cascade-hsm-bridge", unit-scripts = "pkg/common", enable = false, usr-merge = false }

[package.metadata.deb.variants.debian-bullseye]
systemd-units = { unit-name = "cascade-hsm-bridge", unit-scripts = "pkg/common", enable = false, usr-merge = false }

[package.metadata.deb.variants.ubuntu-focal]
systemd-units = { unit-name = "cascade-hsm-bridge", unit-scripts = "pkg/common", enable = false, usr-merge = false }

[package.metadata.deb.variants.ubuntu-jammy]
systemd-units = { unit-name = "cascade-hsm-bridge", unit-scripts = "pkg/common", enable = false, usr-merge = false }

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/cascade-hsm-bridge", dest = "/usr/bin/cascade-hsm-bridge", mode = "755" },
  { source = "target/rpm/cascade-hsm-bridge.service", dest = "/lib/systemd/system/cascade-hsm-bridge.service", mode = "644" },
  { source = "doc/manual/build/man/cascade-hsm-bridge.1", dest = "/usr/share/man/man1/cascade-hsm-bridge.1", mode = "644", doc = true },
  { source = "doc/manual/build/man/cascade-hsm-bridge-config.toml.5", dest = "/usr/share/man/man5/cascade-hsm-bridge-config.toml.5", mode = "644", doc = true },
  { source = "etc/config.toml.system-service", dest = "/etc/cascade-hsm-bridge/config.toml", mode = "644", config = true },
  { source = "pkg/common/service.preset", dest = "/lib/systemd/system-preset/50-cascade-hsm-bridge.preset", mode = "644" },
]
# These get set using cargo-generate-rpm --set-metadata at package build time.
#post_install_script = ...
#pre_uninstall_script = ...
#post_uninstall_script = ...

# ensure that the useradd and rsync tools are present by installing their respective packages
[package.metadata.generate-rpm.requires]
shadow-utils = "*"

# Instruct RPM/YUM to replace the kmip2pkcs11 package with the new cascade-hsm-bridge package.
[package.metadata.generate-rpm.obsoletes]
kmip2pkcs11 = "*"
